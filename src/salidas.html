<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Salida – Autos Colombia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout">
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1>🔴 Registro de Salida</h1>
                <p>Registrar salida de vehículo del parqueadero</p>
            </div>
            <div class="topbar-actions">
                <span class="topbar-time" id="topbarTime"></span>
                <a href="dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
            </div>
        </header>

        <main class="page-content">
            <div class="grid-2">
                <!-- Búsqueda y salida -->
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">Buscar Vehículo</div>
                            <div class="card-subtitle">Ingrese la placa del vehículo a retirar</div>
                        </div>
                    </div>

                    <div id="alertBox"></div>

                    <div class="form-group mb-2">
                        <label>🔍 Placa del Vehículo *</label>
                        <div style="display:flex;gap:0.5rem">
                            <input type="text" id="inputPlaca" class="form-control"
                                   placeholder="Ej: ABC123"
                                   style="text-transform:uppercase;font-weight:700;font-size:1.1rem;letter-spacing:0.1em;font-family:monospace"
                                   maxlength="7" oninput="this.value=this.value.toUpperCase()">
                            <button class="btn btn-primary" onclick="buscarVehiculo()" id="btnBuscar">Buscar</button>
                        </div>
                    </div>

                    <div id="resultadoSalida" style="display:none">
                        <hr class="divider">
                        <!-- Card de resumen del vehículo -->
                        <div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.25rem">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
                                <div>
                                    <div id="sumPlaca" style="font-size:1.75rem;font-weight:800;font-family:monospace;color:var(--accent-cyan)"></div>
                                    <div id="sumTipo" class="text-muted text-sm"></div>
                                </div>
                                <span class="badge badge-danger animate-pulse">DENTRO</span>
                            </div>
                            <div class="grid-2" style="gap:0.75rem">
                                <div><div class="text-muted text-sm">Propietario</div><div style="font-weight:600" id="sumPropietario"></div></div>
                                <div><div class="text-muted text-sm">Celda Asignada</div><div style="font-weight:600" id="sumCelda"></div></div>
                                <div><div class="text-muted text-sm">Hora de Entrada</div><div style="font-weight:600" id="sumEntrada"></div></div>
                                <div><div class="text-muted text-sm">Tiempo Dentro</div><div style="font-weight:700;color:var(--accent-orange)" id="sumTiempo"></div></div>
                            </div>
                        </div>

                        <div class="form-group mb-2">
                            <label>Observaciones de salida (opcional)</label>
                            <textarea id="inputObs" class="form-control" placeholder="Observaciones..."></textarea>
                        </div>

                        <button class="btn btn-danger" onclick="registrarSalida()" style="width:100%;padding:0.875rem;font-size:1rem">
                            🚪 Confirmar Salida
                        </button>
                    </div>
                </div>

                <!-- Lista de vehículos dentro -->
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">🚗 Vehículos Actualmente Dentro</div>
                            <div class="card-subtitle" id="countDentro">Cargando...</div>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Tipo</th>
                                    <th>Celda</th>
                                    <th>Tiempo</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tablaDentro"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
Layout.init('salidas.html');

let movActual = null;
let celdaActual = null;

function renderVehiculosDentro() {
    const movimientos = DB.Movimientos.find(m => m.estado === 'DENTRO');
    document.getElementById('countDentro').textContent = `${movimientos.length} vehículo(s) dentro`;
    const tbody = document.getElementById('tablaDentro');

    if (!movimientos.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem">No hay vehículos dentro</td></tr>`;
        return;
    }

    tbody.innerHTML = movimientos.map(m => {
        const v = DB.Vehiculos.getById(m.vehiculoId);
        const c = DB.Celdas.getById(m.celdaId);
        return `<tr>
            <td><span class="font-mono" style="color:var(--accent-cyan);font-weight:700">${v?.placa || '—'}</span></td>
            <td>${v?.tipo || '—'}</td>
            <td><span class="badge badge-info">${c?.numero || '—'}</span></td>
            <td>${Utils.formatDuration(m.fechaEntrada)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="cargarSalida('${v?.placa}')">Salida</button></td>
        </tr>`;
    }).join('');
}

function cargarSalida(placa) {
    document.getElementById('inputPlaca').value = placa;
    buscarVehiculo();
}

function buscarVehiculo() {
    const placa = document.getElementById('inputPlaca').value.trim().toUpperCase();
    const alertBox = document.getElementById('alertBox');
    const resultado = document.getElementById('resultadoSalida');

    alertBox.innerHTML = '';
    resultado.style.display = 'none';
    movActual = null;

    if (!placa) {
        alertBox.innerHTML = `<div class="alert alert-warning">⚠️ Ingresa la placa del vehículo.</div>`;
        return;
    }

    const vehiculo = DB.Vehiculos.findOne(v => v.placa === placa);
    if (!vehiculo) {
        alertBox.innerHTML = `<div class="alert alert-danger">❌ No se encontró el vehículo con placa <strong>${placa}</strong>.</div>`;
        return;
    }

    const movimiento = DB.getMovimientoActivo(vehiculo.id);
    if (!movimiento) {
        alertBox.innerHTML = `<div class="alert alert-warning">⚠️ El vehículo <strong>${placa}</strong> no tiene registro de entrada activo.</div>`;
        return;
    }

    const persona = DB.Personas.getById(vehiculo.personaId);
    const celda = DB.Celdas.getById(movimiento.celdaId);

    movActual = movimiento;
    celdaActual = celda;

    document.getElementById('sumPlaca').textContent = vehiculo.placa;
    document.getElementById('sumTipo').textContent = `${vehiculo.tipo} · ${vehiculo.marca || ''} ${vehiculo.color || ''}`;
    document.getElementById('sumPropietario').textContent = persona?.nombreCompleto || '—';
    document.getElementById('sumCelda').textContent = celda ? `${celda.numero} (Sector ${celda.sector})` : '—';
    document.getElementById('sumEntrada').textContent = Utils.formatDateTime(movimiento.fechaEntrada);
    document.getElementById('sumTiempo').textContent = Utils.formatDuration(movimiento.fechaEntrada);

    resultado.style.display = 'block';
}

function registrarSalida() {
    if (!movActual || !celdaActual) return;

    const user = Auth.getUser();
    const obs = document.getElementById('inputObs').value;

    DB.Movimientos.update(movActual.id, {
        fechaSalida: new Date().toISOString(),
        estado: 'SALIO',
        usuarioSalidaId: user.userId,
        observaciones: obs || movActual.observaciones
    });

    DB.Celdas.update(celdaActual.id, { estado: 'LIBRE' });

    const veh = DB.Vehiculos.getById(movActual.vehiculoId);
    Toast.success(`✅ Salida registrada: ${veh?.placa || ''} · Celda ${celdaActual.numero} liberada`);

    document.getElementById('inputPlaca').value = '';
    document.getElementById('resultadoSalida').style.display = 'none';
    document.getElementById('alertBox').innerHTML = '';
    document.getElementById('inputObs').value = '';
    movActual = null;
    celdaActual = null;

    renderVehiculosDentro();
}

// Si viene con placa pre-seleccionada desde dashboard
const placaPre = sessionStorage.getItem('ac_salida_placa');
if (placaPre) {
    sessionStorage.removeItem('ac_salida_placa');
    document.getElementById('inputPlaca').value = placaPre;
    buscarVehiculo();
}

document.getElementById('inputPlaca').addEventListener('keydown', e => {
    if (e.key === 'Enter') buscarVehiculo();
});

renderVehiculosDentro();
</script>
</body>
</html>
