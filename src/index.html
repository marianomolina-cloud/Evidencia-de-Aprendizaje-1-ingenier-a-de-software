<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión del Parqueadero Autos Colombia - Login">
    <title>Autos Colombia – Ingreso al Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); overflow: hidden; }
        .login-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(6,182,212,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.1) 0%, transparent 50%); pointer-events: none; }
        .login-particles { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        .particle { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-cyan); opacity: 0.3; animation: floatParticle linear infinite; }
        @keyframes floatParticle { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
        .login-card { position: relative; z-index: 10; width: 100%; max-width: 420px; padding: 2rem; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 1.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.4); animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem; box-shadow: 0 10px 30px rgba(6,182,212,0.4); }
        .login-logo h1 { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); }
        .login-logo p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; color: var(--text-secondary); font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 0.75rem; color: var(--text-primary); font-size: 0.95rem; font-family: 'Inter', sans-serif; transition: all 0.2s; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .form-group input::placeholder { color: var(--text-muted); }
        .btn-login { width: 100%; padding: 0.875rem; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: white; border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s; margin-top: 0.5rem; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6,182,212,0.4); }
        .btn-login:active { transform: translateY(0); }
        .login-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.8rem; }
        .error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
        .demo-hint { background: rgba(6,182,212,0.1); border: 1px solid rgba(6,182,212,0.2); border-radius: 0.75rem; padding: 0.75rem 1rem; margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); text-align: center; }
        .demo-hint strong { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div class="login-bg"></div>
    <div class="login-particles" id="particles"></div>

    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">🅿️</div>
            <h1>Autos Colombia</h1>
            <p>Sistema de Gestión de Parqueadero</p>
        </div>

        <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
        </form>

        <div class="demo-hint">
            <strong>Demo:</strong> admin / admin123 &nbsp;|&nbsp; operador / oper123
        </div>

        <div class="login-footer">
            Parqueadero Autos Colombia &copy; 2026 — v1.0
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Partículas flotantes
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (-Math.random() * 20) + 's';
            p.style.opacity = 0.1 + Math.random() * 0.3;
            container.appendChild(p);
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.textContent = 'Verificando...';
            btn.disabled = true;
            
            setTimeout(() => {
                const user = Auth.login(username, password);
                if (user) {
                    btn.textContent = '✓ Acceso Correcto';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    setTimeout(() => window.location.href = 'dashboard.html', 800);
                } else {
                    errorMsg.style.display = 'block';
                    btn.textContent = 'Iniciar Sesión';
                    btn.disabled = false;
                    setTimeout(() => errorMsg.style.display = 'none', 3000);
                }
            }, 600);
        }

        // Si ya está logueado, redirigir
        if (Auth && Auth.getUser()) window.location.href = 'dashboard.html';
    </script>
</body>
</html>
