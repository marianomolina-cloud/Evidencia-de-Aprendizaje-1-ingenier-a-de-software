<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial – Autos Colombia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="app-layout">
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1>📋 Historial de Movimientos</h1>
                <p>Registro completo de entradas y salidas</p>
            </div>
            <div class="topbar-actions">
                <span class="topbar-time" id="topbarTime"></span>
            </div>
        </header>

        <main class="page-content">
            <!-- Filtros -->
            <div class="card mb-2">
                <div class="card-title" style="margin-bottom:1rem">🔍 Filtros</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Placa</label>
                        <input type="text" id="fPlaca" class="form-control" placeholder="ABC123" oninput="this.value=this.value.toUpperCase();renderTabla()" maxlength="7">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="fEstado" class="form-control" onchange="renderTabla()">
                            <option value="">Todos</option>
                            <option value="DENTRO">Dentro</option>
                            <option value="SALIO">Salió</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="fFecha" class="form-control" onchange="renderTabla()">
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end">
                        <button class="btn btn-outline btn-sm" onclick="limpiarFiltros()">🗑️ Limpiar</button>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <div class="card-title">Movimientos Registrados</div>
                        <div class="card-subtitle" id="countLabel"></div>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Placa</th>
                                <th>Tipo</th>
                                <th>Propietario</th>
                                <th>Celda</th>
                                <th>Entrada</th>
                                <th>Salida</th>
                                <th>Duración</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
Layout.init('historial.html');

function renderTabla() {
    const placa = document.getElementById('fPlaca').value.trim();
    const estado = document.getElementById('fEstado').value;
    const fecha = document.getElementById('fFecha').value;

    let movimientos = DB.Movimientos.getAll().reverse();

    if (placa) {
        const vids = DB.Vehiculos.find(v => v.placa.includes(placa)).map(v => v.id);
        movimientos = movimientos.filter(m => vids.includes(m.vehiculoId));
    }
    if (estado) movimientos = movimientos.filter(m => m.estado === estado);
    if (fecha) movimientos = movimientos.filter(m => m.fechaEntrada && m.fechaEntrada.startsWith(fecha));

    document.getElementById('countLabel').textContent = `${movimientos.length} registro(s) encontrado(s)`;
    const tbody = document.getElementById('tablaHistorial');

    if (!movimientos.length) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:3rem">Sin registros que coincidan con los filtros</td></tr>`;
        return;
    }

    tbody.innerHTML = movimientos.map((m, i) => {
        const veh = DB.Vehiculos.getById(m.vehiculoId);
        const persona = veh ? DB.Personas.getById(veh.personaId) : null;
        const celda = DB.Celdas.getById(m.celdaId);
        return `<tr>
            <td class="text-muted" style="font-size:0.75rem">${m.id}</td>
            <td><span class="font-mono" style="color:var(--accent-cyan);font-weight:700">${veh?.placa || '—'}</span></td>
            <td>${veh?.tipo || '—'}</td>
            <td>${Utils.escapeHtml(persona?.nombreCompleto || '—')}</td>
            <td><span class="badge badge-info">${celda?.numero || '—'}</span></td>
            <td>${Utils.formatDateTime(m.fechaEntrada)}</td>
            <td>${m.fechaSalida ? Utils.formatDateTime(m.fechaSalida) : '<span class="text-muted">—</span>'}</td>
            <td>${Utils.formatDuration(m.fechaEntrada, m.fechaSalida)}</td>
            <td><span class="badge ${m.estado === 'DENTRO' ? 'badge-success' : 'badge-neutral'}">${m.estado === 'DENTRO' ? '🟢 Dentro' : '⚪ Salió'}</span></td>
        </tr>`;
    }).join('');
}

function limpiarFiltros() {
    document.getElementById('fPlaca').value = '';
    document.getElementById('fEstado').value = '';
    document.getElementById('fFecha').value = '';
    renderTabla();
}

renderTabla();
</script>
</body>
</html>
